<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List App</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <div class="header">
            <h1>My Tasks</h1>
            <p>Stay organized and focused</p>
        </div>

        <div class="input-section">
            <input type="text" id="taskInput" placeholder="Add a new task..." aria-label="New task input">
            <button id="addBtn" class="add-btn" aria-label="Add task"><i class="fas fa-plus"></i></button>
        </div>

        <div class="filters">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="active">Active</button>
            <button class="filter-btn" data-filter="completed">Completed</button>
        </div>

        <ul id="taskList" class="task-list">
            <!-- Tasks will be injected here via JavaScript -->
        </ul>
        
        <div class="footer">
            <span id="taskCount">0 tasks remaining</span>
            <button id="clearCompletedBtn" class="clear-btn">Clear Completed</button>
        </div>
    </div>

    <!-- Edit Task Modal -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <h2>Edit Task</h2>
            <input type="text" id="editInput" aria-label="Edit task input">
            <div class="modal-actions">
                <button id="cancelEditBtn" class="cancel-btn">Cancel</button>
                <button id="saveEditBtn" class="save-btn">Save</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
